<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YOLO Training Studio</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="/assets/logo.svg" alt="" class="brand-logo" />
        <div class="brand-text">
          <span class="brand-title">YOLO</span>
          <span class="brand-sub">Training Studio</span>
        </div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <span id="health-dot" class="health-dot" title="Backend status"></span>
        <span id="health-text" class="muted small">connecting…</span>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <h1 id="page-title">Dashboard</h1>
        <div class="topbar-status" id="topbar-status"></div>
      </header>
      <main id="page" class="page"></main>
    </div>
  </div>

  <div id="toasts" class="toasts"></div>
  <div id="modal-root"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
